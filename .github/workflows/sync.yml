name: Sync INMETRO CSV

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # ← elimina o aviso

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4.2.2  # ← versão mais recente

      - name: Instala Python
        uses: actions/setup-python@v5.6.0  # ← versão mais recente
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: pip install requests

      - name: Baixa o CSV
        run: python sync.py

      - name: Commita e envia o CSV atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados_fotovoltaico.csv
          git diff --cached --quiet || git commit -m "chore: atualiza CSV INMETRO $(date +'%Y-%m-%d')"
          git push
      - name: Baixa o CSV
        run: python sync.py 2>&1
