name: Sync INMETRO CSV

on:
  schedule:
    - cron: "0 9 * * *"  # todo dia às 06h horário de Brasília (UTC-3)
  workflow_dispatch:       # permite rodar manualmente também

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instala Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: pip install requests

      - name: Baixa o CSV
        run: python sync.py

      - name: Commita e envia o CSV atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados_fotovoltaico.csv
          git diff --cached --quiet || git commit -m "chore: atualiza CSV INMETRO $(date +'%Y-%m-%d')"
          git push
